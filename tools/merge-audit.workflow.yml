# Merge-loss guard
#
# Whenever commits land on master, re-merge every new merge commit mechanically
# (git --remerge-diff) and flag content that the recorded merge dropped even
# though the file was not conflicted. Those "silent drops" are almost always
# accidents — a conflict resolution that kept one side's whole file and thereby
# reverted other people's master changes (see tools/merge-audit.py for details).
#
# The job never fails the build; it posts warnings and a job summary, and can be
# run manually (workflow_dispatch) for a periodic sweep over a longer window.

name: merge-audit

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      since:
        description: "Audit all merges since this date (YYYY-MM-DD) instead of just the pushed range"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  merge-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # remerge-diff needs full history to find merge bases

      - name: Audit merges for silently dropped content
        shell: bash
        run: |
          set -uo pipefail
          if [ -n "${{ github.event.inputs.since || '' }}" ]; then
            ARGS=(--since "${{ github.event.inputs.since }}")
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            ARGS=(--range "${{ github.event.before }}..${{ github.sha }}")
          else
            # forced push or unknown base: fall back to the last 2 weeks
            ARGS=(--since "$(date -d '14 days ago' +%Y-%m-%d)")
          fi

          python3 tools/merge-audit.py . "${ARGS[@]}" --path-prefix source/ > audit.txt
          STATUS=$?

          cat audit.txt
          {
            echo '## Merge-loss audit'
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ $STATUS -ne 0 ]; then
            echo "::warning title=Possible content lost in a merge::A merge in this push dropped content that a mechanical merge would have kept, in a file that was NOT conflicted. See the job summary of the merge-audit workflow run, and inspect with: git show --remerge-diff <merge-sha>"
          fi
          exit 0   # advisory only — never fail the push
